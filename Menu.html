      <main>
        <!--Datos no visibles-->
       
        <br>
        <div ><h1 class="Titulo">Vehiculos publicados</h1></div>

      <!--Agrregar -->
      <dialog id="dialogAgregar">
        <article>
             <!-- Guarda la URL de la imagen cuando se edita un registro (para no subirla de nuevo si no cambia) -->
      <input type="hidden" id="imagen-url" />

      <!-- Guarda el ID del autp que se está editando (vacío en modo "agregar") -->
      <input type="hidden" id="auto-id" />
            <header>
                <a href="#" class="close" id="btnCerrarModal"></a>
                <h3>Agregar Automoviles</h3>
            </header>
            <form id="frmAgregarIntegrante">
                <label for="opciones">Selecciona un Tipo De Vehiculo:</label>
                
        <select name="opcion_seleccionada" id="opciones-vehiculo">
            <option value="Sedan">Sedan</option>
            <option value="Camioneta">Camioneta</option>
            <option value="Suv">Suv</option>
            <option value="Hatchback">Hatchback</option>
        </select>

                 <label for="opciones">Selecciona un Combustible:</label>
        <select name="opcion_seleccionada" id="opciones-combustible">
            <option value="Especial">Especial</option>
            <option value="Diesel">Diesel</option>
            <option value="Regular">Regular</option>
            <option value="Electrico">Electrico</option>
        </select>
                <input type="file" id="imagen-file" accept="image/*" />
                <input type="date" placeholder="Año" id="anio" required>
                <input type="text" id="marca" placeholder="Marca" required>
                <input type="text" id="modelo" placeholder="Modelo" required>
                <input type="text" placeholder="Vendedor" id="vendedor" required>
                <input type="text" id="precio" placeholder="Precio" required>
                <input type="text" id="comentario" placeholder="Comentario" required>
                <button type="submit" class="contrast">Guardar</button>
            </form>
        </article>
    </dialog>
