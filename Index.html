<!DOCTYPE html>
<html lang="es">
 
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Autos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
  <link rel="stylesheet" href="CSS/Style.css" />
</head>
 
<body>
 
  <header>
    <nav class="navbar navbar-expand-lg navbar-edit">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <img src="IMG/Logo.png" alt="Logo" width="30" height="24">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
          <div class="navbar-nav">
            <a class="nav-link" href="Index.html">Inicio</a>
            <a class="nav-link" href="Menu.html">Agregar</a>
          </div>
        </div>
      </div>
    </nav>
    <br>
    <p class="Sug"><strong>SUGERENCIAS</strong></p>
    <hr>
  </header>
 
  <main>
    <div id="autos-cargados" class="row mt-4 d-flex justify-content-center gap-3">
      <!-- Tarjetas se insertan aquí -->
    </div>
  </main>
 
  <!-- MODAL con dialog -->
  <dialog id="modal">
    <article>
      <header>
        <button onclick="cerrarModal()" class="close" aria-label="Cerrar">&times;</button>
        <h3>Información General</h3>
        <input type="hidden" id="idEditar">
      </header>
 
      <div class="modal-content">
        <img src="IMG/Carro.PNG" alt="Auto" class="modal-img" />
        <div class="modal-info">
          <p><strong>Marca:</strong> <span id="Marca"></span></p>
          <p><strong>Modelo:</strong> <span id="Modelo"></span></p>
          <p><strong>Año:</strong> <span id="Anio"></span></p>
          <p><strong>Propietario:</strong> <span id="Propietario"></span></p>
          <p><strong>Observaciones:</strong> <span id="Observaciones"></span></p>
          <p><strong>Precio:</strong> <span id="Precio"></span></p>
          <p><strong>Tipo de Vehículo:</strong> <span id="TipoVehiculo"></span></p>
          <p><strong>Combustible:</strong> <span id="Combustible"></span></p>
        </div>
      </div>
    </article>
  </dialog>
 
  <!-- Scripts -->
  <script src="JS/Script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
 
</html>
